services:
  - type: web
    name: plant-knowledge-graph
    env: python
    # Use production requirements for faster, lighter deployment
    buildCommand: |
      pip install --upgrade pip && 
      pip install --no-cache-dir -r requirements.txt &&
      python -c "import torch; print('PyTorch version:', torch.__version__)" &&
      python -c "import transformers; print('Transformers version:', transformers.__version__)"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 --preload --max-requests 1000 --max-requests-jitter 50
    # Use starter plus for AI models - starter might not have enough memory
    plan: starter  # Upgrade to 'starter plus' if you get memory errors
    
    # Health check endpoint
    healthCheckPath: /status
    
    envVars:
      # Python version - match your local development
      - key: PYTHON_VERSION
        value: 3.11.9
      
      # Server configuration
      - key: PORT
        sync: false
      - key: FLASK_ENV
        value: production
      
      # Neo4j Database (sync from dashboard for security)
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      
      # File upload configuration
      - key: UPLOAD_FOLDER
        value: uploads
      - key: ALLOWED_EXTENSIONS
        value: png,jpg,jpeg,gif
      
      # AI Model configuration
      - key: MODEL_CHOICE
        value: phi3.5
      
      # Performance optimization
      - key: TRANSFORMERS_CACHE
        value: /tmp/transformers_cache
      - key: TORCH_HOME
        value: /tmp/torch_cache
      
      # Memory optimization for AI models
      - key: PYTORCH_TRANSFORMERS_CACHE
        value: /tmp/pytorch_transformers_cache
      - key: HF_HOME
        value: /tmp/huggingface_cache